<!DOCTYPE html>
<html>
<body>
<canvas id="c192" width="192" height="192"></canvas>
<canvas id="c512" width="512" height="512"></canvas>
<script>
function draw(canvas) {
  const s = canvas.width;
  const ctx = canvas.getContext('2d');

  // Background
  const grad = ctx.createLinearGradient(0, 0, s, s);
  grad.addColorStop(0, '#667eea');
  grad.addColorStop(1, '#764ba2');
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.roundRect(0, 0, s, s, s * 0.2);
  ctx.fill();

  // Grid icon (4 squares representing groups)
  const pad = s * 0.22;
  const gap = s * 0.06;
  const boxSize = (s - pad * 2 - gap) / 2;
  const colors = ['#fff', 'rgba(255,255,255,0.7)', 'rgba(255,255,255,0.85)', 'rgba(255,255,255,0.55)'];

  for (let r = 0; r < 2; r++) {
    for (let c = 0; c < 2; c++) {
      const x = pad + c * (boxSize + gap);
      const y = pad + r * (boxSize + gap);
      ctx.fillStyle = colors[r * 2 + c];
      ctx.beginPath();
      ctx.roundRect(x, y, boxSize, boxSize, s * 0.04);
      ctx.fill();

      // Person icon in each box
      ctx.fillStyle = r * 2 + c === 0 ? '#667eea' : r * 2 + c === 2 ? '#5a6fd6' : '#764ba2';
      const cx = x + boxSize / 2;
      const cy = y + boxSize * 0.38;
      const headR = boxSize * 0.12;
      ctx.beginPath();
      ctx.arc(cx, cy, headR, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.arc(cx, cy + headR * 2.2, headR * 1.5, Math.PI, 0);
      ctx.fill();
    }
  }
}

draw(document.getElementById('c192'));
draw(document.getElementById('c512'));

// Download
['c192', 'c512'].forEach(id => {
  const canvas = document.getElementById(id);
  canvas.toBlob(blob => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `icon-${canvas.width}.png`;
    a.click();
  });
});
</script>
</body>
</html>
